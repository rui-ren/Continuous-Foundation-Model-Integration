trigger: none
pr: none

name: hermes-gpu4090-pilot-$(Date:yyyyMMdd).$(Rev:r)

jobs:
- job: StageHermes
  displayName: Stage pinned Hermes on ORT-GPU-BENCH-5
  timeoutInMinutes: 30
  pool:
    name: FoundryLocal-GPU-4090
    demands:
    - Agent.Name -equals ORT-GPU-BENCH-5
    - Agent.OS -equals Windows_NT
    - Agent.OSArchitecture -equals X64
  steps:
  - checkout: self
    clean: true
    fetchDepth: 1
    persistCredentials: false

  - task: PowerShell@2
    displayName: Validate prerequisites and stage pinned PowerShell
    inputs:
      pwsh: false
      targetType: inline
      script: |
        $ErrorActionPreference = "Stop"
        $expectedIdentity = "NORTHAMERICA\ruiren"
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
        if ($identity -ine $expectedIdentity) {
            throw "Agent identity mismatch. Expected '$expectedIdentity'; running as '$identity'."
        }

        $osArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
        if ($osArchitecture -cne "X64") {
            throw "Pilot requires X64 Windows; found OS=$osArchitecture."
        }

        $python = Get-Command python -ErrorAction SilentlyContinue
        if (-not $python) {
            throw "Python 3.11-3.13 AMD64 is not installed for the agent identity."
        }
        $pythonInfo = & $python.Source -c "import json, platform, struct; print(json.dumps({'version': platform.python_version(), 'machine': platform.machine(), 'bits': struct.calcsize('P') * 8}))" |
            ConvertFrom-Json
        $pythonVersion = [Version]$pythonInfo.version
        if (
            $pythonVersion -lt [Version]"3.11" -or
            $pythonVersion -ge [Version]"3.14" -or
            [int]$pythonInfo.bits -ne 64 -or
            "$($pythonInfo.machine)".ToUpperInvariant() -notin @("AMD64", "X86_64")
        ) {
            throw "Python must be matching 64-bit AMD64 version 3.11-3.13; found $($pythonInfo.version) $($pythonInfo.machine) $($pythonInfo.bits)-bit."
        }
        if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            throw "Git is required but was not found."
        }

        $powerShellVersion = "7.4.13"
        $powerShellSha256 = "8fb52d2172d285b230c2857a90ba4dd28ecf6477ba4a91f91b6854a647b33b65"
        $toolsRoot = Join-Path $env:LOCALAPPDATA "cfmi-hermes-tools"
        $powerShellRoot = Join-Path $toolsRoot "powershell-$powerShellVersion-x64"
        $powerShellArchive = Join-Path $toolsRoot "PowerShell-$powerShellVersion-win-x64.zip"
        $powerShell = Join-Path $powerShellRoot "pwsh.exe"
        New-Item -ItemType Directory -Path $toolsRoot -Force | Out-Null

        $archiveIsValid = (
            (Test-Path -LiteralPath $powerShellArchive -PathType Leaf) -and
            ((Get-FileHash -LiteralPath $powerShellArchive -Algorithm SHA256).Hash -ceq $powerShellSha256)
        )
        if (-not $archiveIsValid) {
            $downloadPath = "$powerShellArchive.download"
            Remove-Item -LiteralPath $downloadPath -Force -ErrorAction SilentlyContinue
            Invoke-WebRequest `
              -UseBasicParsing `
              -Uri "https://github.com/PowerShell/PowerShell/releases/download/v$powerShellVersion/PowerShell-$powerShellVersion-win-x64.zip" `
              -OutFile $downloadPath
            $downloadHash = (Get-FileHash -LiteralPath $downloadPath -Algorithm SHA256).Hash
            if ($downloadHash -cne $powerShellSha256) {
                Remove-Item -LiteralPath $downloadPath -Force -ErrorAction SilentlyContinue
                throw "Downloaded PowerShell archive did not match the pinned SHA-256 digest."
            }
            Move-Item -LiteralPath $downloadPath -Destination $powerShellArchive -Force
        }

        if (Test-Path -LiteralPath $powerShellRoot -PathType Container) {
            Remove-Item -LiteralPath $powerShellRoot -Recurse -Force
        }
        Expand-Archive `
          -LiteralPath $powerShellArchive `
          -DestinationPath $powerShellRoot
        if (-not (Test-Path -LiteralPath $powerShell -PathType Leaf)) {
            throw "Pinned portable PowerShell did not contain pwsh.exe."
        }
        $powerShellProbe = '[pscustomobject]@{ version = $PSVersionTable.PSVersion.ToString(); architecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString() } | ConvertTo-Json -Compress'
        $stagedPowerShell = & $powerShell -NoProfile -Command $powerShellProbe |
            ConvertFrom-Json
        if (
            $LASTEXITCODE -ne 0 -or
            $stagedPowerShell.version -cne $powerShellVersion -or
            $stagedPowerShell.architecture -cne "X64"
        ) {
            throw "Pinned portable PowerShell failed version or architecture verification."
        }
        Write-Host "##vso[task.setvariable variable=CfmiPwsh]$powerShell"

        Write-Host "Pilot prerequisites passed."
        Write-Host "Agent: $(Agent.Name)"
        Write-Host "Identity: $identity"
        Write-Host "Architecture: OS=$osArchitecture Python=$($pythonInfo.machine)"
        Write-Host "Python: $($pythonInfo.version)"
        Write-Host "Portable PowerShell: $($stagedPowerShell.version) $($stagedPowerShell.architecture)"

  - task: PowerShell@2
    displayName: Install pinned dormant Hermes runtime
    inputs:
      pwsh: false
      targetType: inline
      script: |
        $ErrorActionPreference = "Stop"
        $hermesHome = Join-Path $env:LOCALAPPDATA "cfmi-hermes-pilot"
        & "$(CfmiPwsh)" `
          -NoProfile `
          -File "$(Build.SourcesDirectory)\scripts\hermes\Install-HermesPipeline.ps1" `
          -ExpectedWindowsIdentity "NORTHAMERICA\ruiren" `
          -AgentId "local-observer" `
          -HermesHome $hermesHome `
          -Confirm:$false
        if ($LASTEXITCODE -ne 0) {
            throw "Pinned Hermes installer failed with exit code $LASTEXITCODE."
        }

  - task: PowerShell@2
    displayName: Verify staged installation and collect receipt
    inputs:
      pwsh: false
      targetType: inline
      script: |
        $ErrorActionPreference = "Stop"
        $hermesHome = Join-Path $env:LOCALAPPDATA "cfmi-hermes-pilot"
        $hermes = Join-Path $hermesHome "cfmi-runtime\Scripts\hermes.exe"
        if (-not (Test-Path -LiteralPath $hermes -PathType Leaf)) {
            throw "Hermes executable was not created at the expected path."
        }
        $version = (& $hermes --version | Out-String).Trim()
        if ($LASTEXITCODE -ne 0 -or $version -notmatch '(?<![A-Za-z0-9.+-])v0\.21\.5(?![A-Za-z0-9.+-])') {
            throw "Hermes did not report the pinned version."
        }

        $receipt = Get-ChildItem `
          -LiteralPath (Join-Path $hermesHome "installation-attempts") `
          -Filter "*.json" |
          Sort-Object LastWriteTimeUtc -Descending |
          Select-Object -First 1
        if (-not $receipt) {
            throw "No installation receipt was produced."
        }
        $record = Get-Content -LiteralPath $receipt.FullName -Raw | ConvertFrom-Json
        if (
            $record.status -cne "SUCCEEDED" -or
            $record.hermes_version -cne "0.21.5" -or
            $record.hermes_commit -cne "749220ef0007f8d87bd1531f1c24b0fe93816385" -or
            $record.provider_configuration_action -cne "not_managed_by_pipeline" -or
            $record.gateway_action -cne "not_started_by_pipeline" -or
            $record.fleet_connectivity_action -cne "not_configured_by_pipeline"
        ) {
            throw "Installation receipt did not match the reviewed bounded pipeline actions."
        }

        $artifactDirectory = "$(Build.ArtifactStagingDirectory)\hermes-installation"
        New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
        Copy-Item -LiteralPath $receipt.FullName -Destination $artifactDirectory
        Write-Host "Hermes $version is staged. This pipeline did not manage a provider, start a gateway, or configure fleet connectivity."

  - task: PublishPipelineArtifact@1
    displayName: Publish non-secret installation receipt
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)\hermes-installation
      artifact: hermes-installation-receipt
      publishLocation: pipeline
