trigger: none
pr: none

name: hermes-gpu4090-pilot-$(Date:yyyyMMdd).$(Rev:r)

jobs:
- job: StageHermes
  displayName: Stage pinned Hermes on ORT-GPU-BENCH-5
  timeoutInMinutes: 60
  pool:
    name: FoundryLocal-GPU-4090
    demands:
    - Agent.Name -equals ORT-GPU-BENCH-5
    - Agent.OS -equals Windows_NT
    - Agent.OSArchitecture -equals X64
  steps:
  - checkout: self
    clean: true
    fetchDepth: 1
    persistCredentials: false

  - task: PowerShell@2
    displayName: Validate pilot machine prerequisites
    inputs:
      pwsh: false
      targetType: inline
      script: |
        $ErrorActionPreference = "Stop"
        $expectedIdentity = "NORTHAMERICA\ruiren"
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
        if ($identity -ine $expectedIdentity) {
            throw "Agent identity mismatch. Expected '$expectedIdentity'; running as '$identity'."
        }

        $osArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
        if ($osArchitecture -cne "X64") {
            throw "Pilot requires X64 Windows; found OS=$osArchitecture."
        }

        $python = Get-Command python -ErrorAction SilentlyContinue
        if (-not $python) {
            throw "Python 3.11-3.13 AMD64 is not installed for the agent identity."
        }
        $pythonInfo = & $python.Source -c "import json, platform, struct; print(json.dumps({'version': platform.python_version(), 'machine': platform.machine(), 'bits': struct.calcsize('P') * 8}))" |
            ConvertFrom-Json
        $pythonVersion = [Version]$pythonInfo.version
        if (
            $pythonVersion -lt [Version]"3.11" -or
            $pythonVersion -ge [Version]"3.14" -or
            [int]$pythonInfo.bits -ne 64 -or
            "$($pythonInfo.machine)".ToUpperInvariant() -notin @("AMD64", "X86_64")
        ) {
            throw "Python must be matching 64-bit AMD64 version 3.11-3.13; found $($pythonInfo.version) $($pythonInfo.machine) $($pythonInfo.bits)-bit."
        }
        if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            throw "Git is required but was not found."
        }

        Write-Host "Pilot prerequisites passed."
        Write-Host "Agent: $(Agent.Name)"
        Write-Host "Identity: $identity"
        Write-Host "Architecture: OS=$osArchitecture Python=$($pythonInfo.machine)"
        Write-Host "Python: $($pythonInfo.version)"
        Write-Host "Windows PowerShell: $($PSVersionTable.PSVersion)"

  - task: PowerShell@2
    displayName: Install pinned dormant Hermes runtime
    inputs:
      pwsh: false
      targetType: inline
      script: |
        $ErrorActionPreference = "Stop"
        $hermesHome = Join-Path $env:LOCALAPPDATA "cfmi-hermes-pilot-v2"
        & "$(Build.SourcesDirectory)\scripts\hermes\Install-HermesPipeline.ps1" `
          -ExpectedWindowsIdentity "NORTHAMERICA\ruiren" `
          -AgentId "local-observer" `
          -HermesHome $hermesHome `
          -Confirm:$false

  - task: PowerShell@2
    displayName: Resolve exact Azure Pipelines service identity
    inputs:
      pwsh: false
      targetType: inline
      script: |
        $ErrorActionPreference = "Stop"
        $agentHome = "$(Agent.HomeDirectory)"
        if (-not $agentHome) {
            throw "Agent.HomeDirectory is unavailable."
        }
        $serviceMarker = Join-Path $agentHome ".service"
        if (-not (Test-Path -LiteralPath $serviceMarker -PathType Leaf)) {
            throw "The Azure Pipelines agent service marker was not found."
        }
        $serviceName = (Get-Content -LiteralPath $serviceMarker -Raw).Trim()
        if ($serviceName -notmatch '^[A-Za-z0-9][A-Za-z0-9.$_-]{0,255}$') {
            throw "The Azure Pipelines agent service marker contains an invalid service name."
        }
        $service = Get-Service -Name $serviceName -ErrorAction Stop
        if ($service.Name -cne $serviceName) {
            throw "The resolved Windows service name did not match the agent service marker."
        }
        Write-Host "Resolved exact Azure Pipelines service: $serviceName ($($service.Status))"
        Write-Host "##vso[task.setvariable variable=MachineDoctorServiceName]$serviceName"

  - task: PowerShell@2
    displayName: Configure local read-only Machine Doctor
    inputs:
      pwsh: false
      targetType: inline
      script: |
        $ErrorActionPreference = "Stop"
        $hermesHome = Join-Path $env:LOCALAPPDATA "cfmi-hermes-pilot-v2"
        $hermes = Join-Path $hermesHome "cfmi-runtime\Scripts\hermes.exe"
        $computerName = [Environment]::MachineName
        & "$(Build.SourcesDirectory)\scripts\hermes\Configure-HermesMachineDoctor.ps1" `
          -NodeId "gpu-4090-pilot" `
          -ExpectedComputerName $computerName `
          -PipelineAgentServiceName "$(MachineDoctorServiceName)" `
          -Volumes "C:\" `
          -HermesHome $hermesHome `
          -RepositoryRoot "$(Build.SourcesDirectory)" `
          -AgentId "local-observer" `
          -Confirm:$false
        if ($LASTEXITCODE -ne 0) {
            throw "Machine Doctor configuration failed."
        }
        & $hermes mcp test cfmi_fleet_status
        if ($LASTEXITCODE -ne 0) {
            throw "Hermes could not start the configured read-only MCP server."
        }

  - task: PowerShell@2
    displayName: Verify staged pilot and collect receipts
    inputs:
      pwsh: false
      targetType: inline
      script: |
        $ErrorActionPreference = "Stop"
        $hermesHome = Join-Path $env:LOCALAPPDATA "cfmi-hermes-pilot-v2"
        $hermes = Join-Path $hermesHome "cfmi-runtime\Scripts\hermes.exe"
        if (-not (Test-Path -LiteralPath $hermes -PathType Leaf)) {
            throw "Hermes executable was not created at the expected path."
        }
        $version = (& $hermes --version | Out-String).Trim()
        if ($LASTEXITCODE -ne 0 -or $version -notmatch '(?<![A-Za-z0-9.+-])v0\.21\.5(?![A-Za-z0-9.+-])') {
            throw "Hermes did not report the pinned version."
        }

        $receipt = Get-ChildItem `
          -LiteralPath (Join-Path $hermesHome "installation-attempts") `
          -Filter "*.json" |
          Sort-Object LastWriteTimeUtc -Descending |
          Select-Object -First 1
        if (-not $receipt) {
            throw "No installation receipt was produced."
        }
        $record = Get-Content -LiteralPath $receipt.FullName -Raw | ConvertFrom-Json
        if (
            $record.status -cne "SUCCEEDED" -or
            $record.hermes_version -cne "0.21.5" -or
            $record.hermes_commit -cne "749220ef0007f8d87bd1531f1c24b0fe93816385" -or
            $record.provider_configuration_action -cne "not_managed_by_pipeline" -or
            $record.gateway_action -cne "not_started_by_pipeline" -or
            $record.fleet_connectivity_action -cne "not_configured_by_pipeline"
        ) {
            throw "Installation receipt did not match the reviewed bounded pipeline actions."
        }

        $machineDoctorReceipt = Join-Path $hermesHome "machine-doctor\configuration-receipt.json"
        if (-not (Test-Path -LiteralPath $machineDoctorReceipt -PathType Leaf)) {
            throw "No Machine Doctor configuration receipt was produced."
        }
        $machineDoctorRecord = Get-Content -LiteralPath $machineDoctorReceipt -Raw |
            ConvertFrom-Json
        $expectedTools = @(
            "get_job_progress",
            "get_local_system_status",
            "get_node_status",
            "list_nodes"
        )
        if (
            $machineDoctorRecord.status -cne "SUCCEEDED" -or
            $machineDoctorRecord.node_id -cne "gpu-4090-pilot" -or
            $machineDoctorRecord.expected_computer_name -cne [Environment]::MachineName -or
            $machineDoctorRecord.observed_computer_name -cne [Environment]::MachineName -or
            $machineDoctorRecord.pipeline_agent_service_name -cne "$(MachineDoctorServiceName)" -or
            $machineDoctorRecord.provider_configuration_action -cne "not_managed" -or
            $machineDoctorRecord.gateway_action -cne "not_started" -or
            $machineDoctorRecord.remote_transport_action -cne "not_configured" -or
            $machineDoctorRecord.scheduling_action -cne "not_configured" -or
            $machineDoctorRecord.remediation_action -cne "not_enabled" -or
            (Compare-Object $expectedTools @($machineDoctorRecord.tools))
        ) {
            throw "Machine Doctor receipt did not match the reviewed read-only configuration."
        }

        $artifactDirectory = "$(Build.ArtifactStagingDirectory)\hermes-installation"
        New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
        Copy-Item -LiteralPath $receipt.FullName `
          -Destination (Join-Path $artifactDirectory "installation-receipt.json")
        Copy-Item -LiteralPath $machineDoctorReceipt `
          -Destination (Join-Path $artifactDirectory "machine-doctor-receipt.json")
        Write-Host "Hermes $version and the local read-only Machine Doctor are staged. This pipeline did not manage a provider, start a gateway, configure remote transport, schedule collection, or enable remediation."

  - task: PublishPipelineArtifact@1
    displayName: Publish non-secret pilot receipts
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)\hermes-installation
      artifact: hermes-installation-receipt
      publishLocation: pipeline
